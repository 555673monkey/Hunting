
workflows:
  srhunt-ios:
    name: SRHUNT iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: "YOUR.APP.BUNDLE.ID"
      vars:
        XCODE_PROJECT: "YOUR_PROJECT.xcodeproj"
        XCODE_SCHEME: "YOUR_SCHEME"
      xcode: latest

    scripts:
      - name: Set up signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
