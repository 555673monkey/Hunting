
workflows:
  srhunt-ios:
    name: SR HUNT iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.sawyerreis.srhunt
      xcode: latest

    scripts:
      - name: Set up signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/SRHUNT_iOS/SRHUNT.xcodeproj" \
            --scheme "SRHUNT"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
